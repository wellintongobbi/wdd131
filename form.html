<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Submit your product review including rating, features, and experience.">
<meta name="author" content="Wellinton Allan Gobbi">
<link rel="stylesheet" href="styles/styles.css">

</head>
<body>
<header>
    <title>Product Review</title>
</header>

<h1>Product Review</h1>

<form method="get" action="review.html">

<!-- Product -->
<label for="product">Product Name</label>
<select id="product" name="product" required>
    <option value="" disabled selected>Select a Product ...</option>
</select>

<!-- Rating -->
<p>Overall Rating</p>

<label for="star1">
  <input type="radio" id="star1" name="rating" value="1" required> ☆
</label>

<label for="star2">
  <input type="radio" id="star2" name="rating" value="2" required> ☆☆
</label>

<label for="star3">
  <input type="radio" id="star3" name="rating" value="3" required> ☆☆☆
</label>

<label for="star4">
  <input type="radio" id="star4" name="rating" value="4" required> ☆☆☆☆
</label>

<label for="star5">
  <input type="radio" id="star5" name="rating" value="5" required> ☆☆☆☆☆
</label>

<!-- Date -->
<label for="date">Date of Installation</label>
<input type="date" id="date" name="date" required>

<!-- Features -->
<p>Useful Features</p>

<label for="durability">
  <input type="checkbox" id="durability" name="features" value="Durability"> Durability
</label>

<label for="ease">
  <input type="checkbox" id="ease" name="features" value="Ease"> Ease of Use
</label>

<label for="performance">
  <input type="checkbox" id="performance" name="features" value="Performance"> Performance
</label>

<label for="design">
  <input type="checkbox" id="design" name="features" value="Design"> Design
</label>

<!-- Review -->
<label for="review">Written Review</label>
<textarea id="review" name="review"></textarea>

<!-- Name -->
<label for="name">Your Name</label>
<input type="text" id="name" name="name">

<br><br>
<input type="submit" value="Post Review">

</form>

<footer>
<p>©2026 | Wellinton Allan Gobbi</p>
</footer>

<script src="scripts/script.js" defer></script>
</body>
</html>
